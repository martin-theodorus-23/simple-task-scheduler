[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-task-scheduler"
version = "1.0.0"
description = "A minimal, single-file Python background task scheduler with no dependencies"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "FutureSphere Solutions", email = "martin_mathew@nlife.in"}
]
keywords = ["scheduler", "task", "background", "interval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/martin-theodorus-23/simple-task-scheduler"
Repository = "https://github.com/martin-theodorus-23/simple-task-scheduler"
Documentation = "https://github.com/martin-theodorus-23/simple-task-scheduler#readme"

[project.scripts]
simple-task-scheduler = "scheduler:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["scheduler.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/scheduler.py",
    "/README.md",
    "/LICENSE",
    "/tasks.json",
    "/heartbeat.py",
]
